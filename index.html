    <!-- Container Parallax -->

  <script>
    const container = document.getElementById('parallax-container');
    const elements = document.querySelectorAll('[data-depth]');
    
    let mouseX = 0;
    let mouseY = 0;
    let sensitivity = -1; 
    let easingFactor = 0.05;

    const itemStates = Array.from(elements).map(el => {
      return {
        element: el,
        depth: parseFloat(el.getAttribute('data-depth')) || 1,
        currentX: 0,
        currentY: 0
      };
    });

    window.addEventListener('mousemove', (e) => {
      const rect = container.getBoundingClientRect();
      mouseX = e.clientX - rect.left - (rect.width / 2);
      mouseY = e.clientY - rect.top - (rect.height / 2);
    });

    window.addEventListener('touchmove', (e) => {
      if(e.touches.length > 0) {
        const rect = container.getBoundingClientRect();
        mouseX = e.touches[0].clientX - rect.left - (rect.width / 2);
        mouseY = e.touches[0].clientY - rect.top - (rect.height / 2);
      }
    });

    function animate() {
      itemStates.forEach(item => {
        const strength = (item.depth * sensitivity) / 20;
        const targetX = mouseX * strength;
        const targetY = mouseY * strength;

        item.currentX += (targetX - item.currentX) * easingFactor;
        item.currentY += (targetY - item.currentY) * easingFactor;

        item.element.style.transform = `translate3d(${item.currentX}px, ${item.currentY}px, 0)`;
      });

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  </script>
</body>
